# Render Blueprint: deploys the FastAPI backend on Render's free plan.
services:
  - type: web
    name: railshift-api
    runtime: python
    plan: free
    region: singapore          # closest Render region to India
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz  # no database call, so Render's frequent checks stay cheap
    envVars:
      - key: DATABASE_URL        # Supabase *Session pooler* string (you enter it in Render)
        sync: false
      - key: RAILRADAR_API_KEY   # you enter it in Render
        sync: false
      - key: APP_API_KEY         # generated by Render; the Android apps send it as X-App-Key
        generateValue: true
      - key: RAILRADAR_MONTHLY_CAP
        value: "950"
      - key: LIVE_CACHE_MINUTES
        value: "10"
